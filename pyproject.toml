[project]
name = "kallaama-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.8.1",
    "brouhaha",
    "datasets==3.6.0",
    "jiwer==4.0.0",
    "librosa==0.11.0",
    "numpy==2.4.4",
    "omnilingual-asr>=0.2.0",
    "pandas>=3.1.0",
    "pyannote-audio>=3.3.2,<4",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "speechbrain==1.1.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.56.2",
    "utmosv2",
]

[project.scripts]
kallaama-bench = "kallaama_bench:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# brouhaha declares speechbrain<1.0, numpy<2.0 and pyannote.audio<3.3.1, which
# conflict with the evaluator's pins (pyannote <3.3.2 breaks on numpy 2);
# override them so it can coexist with the evaluator's pinned versions.
override-dependencies = [
    "speechbrain==1.1.0",
    "numpy==2.4.4",
    "pyannote-audio>=3.3.2,<4",
]

[tool.uv.sources]
utmosv2 = { git = "https://github.com/sarulab-speech/UTMOSv2.git" }
brouhaha = { url = "https://github.com/marianne-m/brouhaha-vad/archive/main.zip" }
