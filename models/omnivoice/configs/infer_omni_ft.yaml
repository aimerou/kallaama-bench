model:
  name: OmniVoice
  repo: Baamtu/tts-omnivoice-monolingual
  dtype: float16           # torch dtype, e.g. float16, bfloat16, float32

inference:
  corpus_file: "../../data/corpus.csv"
  corpus_separator: "|"

  reference_audio_dir: "../../data/references/audio/"
  reference_transcriptions_file: "../../data/references/transcriptions.json"
  output_dir: "../../submissions/omnivoice-ft/"

  synthesis_sampling_rate: 24000
  output_sampling_rate: 16000

  num_sentences: null        # null = synthesise the full corpus (1602 rows); set an int to test on a subset

submission:
  team: "Baamtu"
  system: "OmniVoice Wolof Monolingual"
  contact: "contact@baamtu.com"
  notes: ""

evaluation:
  audio_folder: "../../submissions/omnivoice-ft/audio/"
  output_json_file: "../../results/omnivoice-ft/results_omnivoice_ft.json"
  denoiser_model: speechbrain/sepformer-wham16k-enhancement
  snr:
    chunk_duration_s: 5
    min_chunk_duration_s: 0.5   # chunks shorter than this are skipped